<!DOCTYPE html>
<html lang="en">
<!-- 加载对话框 -->
<div id="app">Please wait...</div>
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="./vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '导航', // 文档标题，会显示在侧边栏顶部
      repo: 'https://github.com/uzihao', // 右上角图标链接
      loadNavbar: true, // 默认加载 _navbar.md，作为顶部导航栏
      loadSidebar: true, // 默认加载 _sidebar.md，作为侧边栏
      subMaxLevel: 3, // 生成目录的最大层级
      auto2top: true,//切换页面后是否自动跳转到页面顶部
      search: {
        paths: 'auto',
        placeholder: '搜索',
        noData: '找不到结果',
        depth: 10,
      },
      count:{
        countable:true,
        fontsize:'0.9em',
        color:'rgb(90,90,90)',
        language:'chinese',
      },
      coverpage: true, // 封面
    }
  </script>
  <!-- Docsify v4 -->
  <script src="./js/docsify@4.js"></script>
  <!-- emoji -->
  <script src="./js/emoji.min.js"></script>
  <!-- 搜索插件 -->
  <script src="./js/search.min.js"></script>
  <!-- 一键复制插件 -->
  <script src="./js/docsify-copy-code.js"></script>
  <!-- 代码高亮 -->
  <script src="./js/prism-bash.min.js"></script>
  <script src="./js/prism-c.min.js"></script>
  <script src="./js/prism-json.min.js"></script>
  <script src="./js/prism-shell-session.min.js"></script>
  <script src="./js/prism-python.min.js"></script>
  <script src="./js/prism-http.min.js"></script>
  <!-- 主题 -->
  <!--<link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/buble.css">-->
  <!--<link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/dark.css">-->
  <!-- <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/pure.css"> -->
  <!-- 其他比较好的主题插件 -->
  <!-- <link rel="stylesheet" href="//docsify-darklight-theme.boopathikumar.me/#/installation"> -->
  <!--<link rel="stylesheet" href="//osiris-ui.github.io/osiris/#/quick-start">-->
</body>
</html>
